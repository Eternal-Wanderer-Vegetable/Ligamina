[workspace]
members = ["crates/ligamina-contracts", "crates/ligamina-core", "crates/ligamina-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.97"

[workspace.dependencies]
anyhow = "=1.0.100"
axum = { version = "=0.8.9", features = ["json"] }
futures = "=0.3.34"
jsonschema = { version = "=0.58.6", default-features = false }
rmcp = { version = "=3.5.1", default-features = false, features = ["macros", "server", "transport-io", "transport-streamable-http-server"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
thiserror = "=2.0.17"
tokio = { version = "=1.48.0", features = ["full"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
uuid = { version = "=1.18.1", features = ["v4", "serde"] }
