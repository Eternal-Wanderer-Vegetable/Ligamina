name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.platform }} checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-2025
          - platform: linux
            os: ubuntu-24.04
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install locked Node runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.20.0
          package-manager-cache: false

      - name: Install locked uv runtime
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.5
          enable-cache: true
          cache-dependency-glob: |
            hosts/nonebot/uv.lock
            lab/uv.lock
          github-token: ${{ github.token }}

      - name: Install locked Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy

      - name: Run locked checks and G1 smoke
        if: matrix.platform == 'windows'
        run: pwsh -NoProfile -File scripts/check.ps1

      - name: Install and start packaged Windows runtime
        if: matrix.platform == 'windows'
        run: pwsh -NoProfile -File scripts/windows-install-acceptance.ps1 -ReportPath outputs/acceptance/ci-windows-install-acceptance.json

      - name: Run locked checks and G1 smoke
        if: matrix.platform == 'linux'
        run: bash scripts/check.sh

      - name: Build Linux container image
        if: matrix.platform == 'linux'
        env:
          LIGAMINA_ADMIN_TOKEN: ci-build-placeholder-token-not-for-runtime
          LIGAMINA_PROFILES: nonebot,koishi
        run: docker compose -f deploy/linux/compose.yaml --profile nonebot --profile koishi build

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-evidence-${{ matrix.platform }}
          path: |
            outputs/acceptance/ci-smoke-${{ matrix.platform }}.json
            outputs/acceptance/ci-windows-install-acceptance.json
          if-no-files-found: warn
          retention-days: 30
