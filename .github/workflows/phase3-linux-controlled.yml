name: Phase 3 Linux controlled recovery

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase3-linux-controlled-p3-recovery-linux-8c161abc3e6e
  cancel-in-progress: false

jobs:
  dispatch-guard:
    name: Verify controlled-runner dispatch context
    runs-on: ubuntu-24.04
    outputs:
      eligible: ${{ steps.guard.outputs.eligible }}
    steps:
      - name: Allow only an opted-in dispatch from the default branch
        id: guard
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.repository == github.event.repository.full_name &&
          github.event.repository.fork == false &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          vars.PHASE3_LINUX_RUNNER_ENABLED == 'true'
        run: echo "eligible=true" >> "$GITHUB_OUTPUT"

      - name: Explain why the controlled runner was not dispatched
        if: steps.guard.outcome != 'success'
        run: 'echo "Controlled Phase 3 runner skipped: dispatch must come from the opted-in origin repository default branch."'

  linux-recovery:
    name: Locked Linux pilot on isolated runner
    needs: dispatch-guard
    if: needs.dispatch-guard.outputs.eligible == 'true'
    runs-on: [self-hosted, linux, x64, ligamina-phase3]
    environment: phase3-linux-controlled
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install locked Node runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.20.0
          package-manager-cache: false

      - name: Install locked uv runtime
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.5
          enable-cache: false
          github-token: ${{ github.token }}

      - name: Run frozen Linux recovery campaign with interruption evidence
        run: |
          uv python install 3.12.14
          bash scripts/phase3-linux-controlled-runner.sh

      - name: Upload controlled-runner reports on success, failure, or cancellation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase3-linux-controlled-${{ github.run_id }}
          path: |
            outputs/acceptance/phase3-p309-linux-workers-${{ github.run_id }}.json
            outputs/acceptance/phase3-p309-linux-admission-${{ github.run_id }}.json
            outputs/acceptance/phase3-p309-linux-recovery-${{ github.run_id }}.json
            outputs/acceptance/phase3-p309-linux-controlled-${{ github.run_id }}.json
            outputs/acceptance/phase3-p309-linux-controlled-${{ github.run_id }}.log
            ${{ runner.temp }}/Ligamina-automation-evidence/**/*.json
          if-no-files-found: warn
          retention-days: 90
