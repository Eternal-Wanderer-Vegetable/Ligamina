name: Phase 3 Linux self-test

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase3-linux-self-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-self-test:
    name: Linux contracts and automation regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install locked Node runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.20.0
          package-manager-cache: false

      - name: Install locked uv runtime
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.5
          enable-cache: true
          cache-dependency-glob: lab/uv.lock
          github-token: ${{ github.token }}

      - name: Run Linux-only Phase 3 self-test
        run: bash scripts/phase3-linux-self-test.sh

      - name: Upload self-test report on success, failure, or cancellation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase3-linux-self-test-${{ github.run_id }}
          path: |
            outputs/acceptance/phase3-p309-linux-self-test-${{ github.run_id }}.json
            outputs/acceptance/phase3-p309-linux-self-test-${{ github.run_id }}.log
          if-no-files-found: warn
          retention-days: 30
