[project]
name = "ligamina-nonebot-host"
version = "0.1.0"
description = "Native NoneBot 2 host for Ligamina"
requires-python = "==3.12.14.*"
dependencies = [
    "jsonschema==4.25.1",
    "nonebot-adapter-onebot==2.4.6",
    "nonebot2[fastapi]==2.5.0",
]

[dependency-groups]
dev = [
    "nonebug==0.4.4",
    "pytest==8.4.2",
    "pytest-asyncio>=1.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
